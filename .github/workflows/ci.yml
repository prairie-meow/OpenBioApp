name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  python-tests:
    name: Scientific Worker & Factory Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install worker & factory dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt pytest pyyaml
      - name: Run Worker Scientific Engine Tests
        working-directory: worker
        env:
          PYTHONPATH: .
        run: pytest tests/test_worker.py -v
      - name: Run 7-Subagent Factory Pipeline Tests
        env:
          PYTHONPATH: .
        run: pytest factory/tests/test_factory.py -v
