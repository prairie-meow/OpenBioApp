# OpenBioApp — Zero-Config Local Self-Hosting Compose
# Usage: docker compose up --build
services:
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: openbioapp-worker
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  web:
    image: node:22-alpine
    container_name: openbioapp-web
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "5173:5173"
    environment:
      - VITE_WORKER_URL=http://worker:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - worker
